# ==============================================================================
# EduPulse ERP - Spring Boot Production Configuration
# Database Engine: PostgreSQL 18
# ==============================================================================

spring.application.name=edupulse-erp

# Server Port
server.port=8080
server.servlet.context-path=/api/v1

# Primary PostgreSQL 18 Datasource Configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/edupulse_erp?sslmode=disable&ApplicationName=EduPulse_Backend
spring.datasource.username=edupulse_admin
spring.datasource.password=edupulse_secure_password_2026
spring.datasource.driver-class-name=org.postgresql.Driver

# HikariCP Connection Pool Settings (Tuned for High Concurrency)
spring.datasource.hikari.pool-name=EduPulseHikariPool
spring.datasource.hikari.maximum-pool-size=30
spring.datasource.hikari.minimum-idle=10
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.max-lifetime=1200000
spring.datasource.hikari.auto-commit=true
spring.datasource.hikari.leak-detection-threshold=60000

# JPA & Hibernate Settings
spring.jpa.database=postgresql
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.jdbc.batch_size=50
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true
spring.jpa.open-in-view=false

# Flyway Database Migration Settings
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
spring.flyway.locations=classpath:db/migration
spring.flyway.table=schema_version_history
spring.flyway.schemas=public
spring.flyway.connect-retries=5

# Redis Cache & Session Configuration
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.data.redis.password=edupulse_redis_secret_2026
spring.cache.type=redis
spring.cache.redis.time-to-live=3600000
spring.cache.redis.cache-null-values=false

# RabbitMQ Message Broker Configuration
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=edupulse_mq
spring.rabbitmq.password=edupulse_mq_secret_2026
spring.rabbitmq.virtual-host=/
spring.rabbitmq.listener.simple.concurrency=5
spring.rabbitmq.listener.simple.max-concurrency=10

# MinIO / S3 Storage Configuration
edupulse.storage.minio.endpoint=http://localhost:9000
edupulse.storage.minio.access-key=edupulse_minio_admin
edupulse.storage.minio.secret-key=edupulse_minio_secret_2026
edupulse.storage.minio.bucket-name=edupulse-documents

# Actuator & Observability
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=always
management.health.db.enabled=true
management.health.redis.enabled=true
management.health.rabbit.enabled=true
