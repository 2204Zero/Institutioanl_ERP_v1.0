server:
  port: 8081
  servlet:
    context-path: /

spring:
  application:
    name: institutional-erp-backend
  profiles:
    active: dev
  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 15MB
  jackson:
    serialization:
      write-dates-as-timestamps: false

# Storage configuration
app:
  storage:
    document-dir: ${APP_STORAGE_DOCUMENT_DIR:uploads/documents}

# SpringDoc OpenAPI / Swagger Configuration
springdoc:
  api-docs:
    path: /v3/api-docs
    enabled: true
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
    operationsSorter: method
    tagsSorter: alpha

