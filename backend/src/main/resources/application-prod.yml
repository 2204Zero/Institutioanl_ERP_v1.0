spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/edupulse_erp
    username: edupulse_admin
    password: ${DB_PASSWORD:edupulse_secure_password_2026}
    driver-class-name: org.postgresql.Driver
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: validate
    show-sql: false
  flyway:
    enabled: true
    baseline-on-migrate: true

logging:
  level:
    org.flywaydb: INFO
